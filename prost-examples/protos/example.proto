syntax = "proto3";

package example;

message User {
    uint32 id = 1;
    string name = 2;
    string email = 3;
    uint32 age = 4;
    bool is_active = 5;
    UserType type = 6;
    repeated Address addresses = 7;
    oneof payment_method {
        CreditCard credit_card = 8;
        BankAccount bank_account = 9;
    }
    repeated Transaction transactions = 10;
    map <int32, Post> posts = 11;

    enum UserType {
        READER = 0;
        AUTHOR = 1;
        EDITOR = 2;
    }

    message Address {
        string street = 1;
        string city = 2;
        string state = 3;
        string zip_code = 4;
        string country = 5;
    }
}

message Post {
    string title = 1;
    bytes body = 2;
}

message Transaction {
    float amount = 1;
    uint64 timestamp = 2;
}

message CreditCard {
    string card_number = 1;
    uint32 expiry_month = 3;
    uint32 expiry_year = 4;
    string cvv = 5;
}

message BankAccount {
    string account_number = 1;
    string routing_number = 2;
    string bank_name = 4;
}
